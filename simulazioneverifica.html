<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Verifica Divisibilità</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 8px;
            margin: 10px;
            width: 150px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #risultato {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Controllo Divisibilità</h1>

    <input type="number" id="num1" placeholder="Primo numero">
    <br>

    <input type="number" id="num2" placeholder="Secondo numero">
    <br>

    <button onclick="controllaDivisibilita()">Controlla</button>

    <div id="risultato"></div>

    <script>
        function controllaDivisibilita() {
            let a = parseInt(document.getElementById("num1").value);
            let b = parseInt(document.getElementById("num2").value);

            if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) {
                document.getElementById("risultato").innerText = 
                    "Inserisci due numeri interi positivi!";
                return;
            }

            if (a % b === 0) {
                document.getElementById("risultato").innerText = 
                    a + " è divisibile per " + b;
            } else if (b % a === 0) {
                document.getElementById("risultato").innerText = 
                    b + " è divisibile per " + a;
            } else {
                document.getElementById("risultato").innerText = 
                    "I numeri NON sono divisibili tra loro";
            }
        }
    </script>

</body>
</html>
