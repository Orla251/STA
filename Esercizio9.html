<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esercizio 9</title>
     <style>
       
       button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Generatore Numeri Casuali</h1>

    <button onclick="generaNumero()">1) Genera numero casuale </button>
    <button onclick="arrotondaNumero()">2) Math.floor(numero)</button>
    <button onclick="generaDa1a90()">3) Numero casuale moltiplicato x 90</button>

    <div id="risultato">Risultato: </div>

    <script>
        let numeroCasuale = 0;

        function generaNumero() {
            numeroCasuale = Math.random();
            document.getElementById("risultato").innerHTML =
                "Numero casuale generato: " + numeroCasuale;
        }

        function arrotondaNumero() {
            let numeroFloor = Math.floor(numeroCasuale);
            document.getElementById("risultato").innerHTML =
                "Math.floor(numeroCasuale): " + numeroFloor;
        }

        function generaDa1a90() {
        let numero = Math.floor(numeroCasuale * 90) + 1;
        document.getElementById("risultato").innerHTML =
            "Numero tra 1 e 90 (dal numero generato): " + numero;
    }
    </script>

</body>
</html>
